<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Mi Biblioteca</h1>
        <p>Una colección de videojuegos</p>
    </header>

    <main>
        <section class="intro">
            <h2>Mis videojuegos</h2>
            <p>Explora esta pequeña colección.</p>

            <input
                type="text"
                id="busqueda"
                placeholder="Buscar videojuego..."
            >
        </section>

        <section id="biblioteca" class="biblioteca">

            <article class="juego">
                <img src="images/half-life.jpg"
                     alt="Portada de Half-Life">
                <h3>Half-Life</h3>
                <p>Disparos · 1998</p>
            </article>

            <article class="juego">
                <img src="images/portal.jpg"
                     alt="Portada de Portal">
                <h3>Portal</h3>
                <p>Rompecabezas · 2007</p>
            </article>

            <article class="juego">
                <img src="images/doom.jpg"
                     alt="Portada de DOOM">
                <h3>DOOM</h3>
                <p>Acción · 1993</p>
            </article>

            <article class="juego">
                <img src="images/undertale.jpg"
                     alt="Portada de Undertale">
                <h3>Undertale</h3>
                <p>RPG · 2015</p>
            </article>

        </section>
    </main>

    <footer>
        <p>Proyecto académico de contenerización con Docker.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
